<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timer</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f1f5f9;
      color: #172033;
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(92vw, 420px);
      padding: 2rem;
      text-align: center;
      background: white;
      border-radius: 20px;
      box-shadow: 0 12px 40px #1720331a;
    }

    h1 { margin: 0 0 1.5rem; }

    .inputs {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    label { display: grid; gap: .4rem; color: #526078; }

    input {
      width: 90px;
      padding: .7rem;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font: inherit;
      font-size: 1.2rem;
      text-align: center;
    }

    #display {
      margin: 1rem 0 1.5rem;
      font-size: clamp(3.5rem, 18vw, 5.5rem);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }

    .buttons { display: flex; justify-content: center; gap: .7rem; }

    button {
      padding: .75rem 1.1rem;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { filter: brightness(.92); }
    button.secondary { background: #64748b; }
    button:disabled { opacity: .5; cursor: not-allowed; }

    #message { min-height: 1.5em; color: #2563eb; }
  </style>
</head>
<body>
  <main>
    <h1>Timer</h1>

    <div class="inputs">
      <label>
        Minuten
        <input id="minutes" type="number" min="0" max="999" value="5">
      </label>
      <label>
        Sekunden
        <input id="seconds" type="number" min="0" max="59" value="0">
      </label>
    </div>

    <div id="display" role="timer" aria-live="off">05:00</div>

    <div class="buttons">
      <button id="start">Start</button>
      <button id="pause" class="secondary" disabled>Pause</button>
      <button id="reset" class="secondary">Zurücksetzen</button>
    </div>

    <p id="message" aria-live="polite"></p>
  </main>

  <script>
    const minutesInput = document.getElementById("minutes");
    const secondsInput = document.getElementById("seconds");
    const display = document.getElementById("display");
    const message = document.getElementById("message");
    const startButton = document.getElementById("start");
    const pauseButton = document.getElementById("pause");

    let remaining = 300;
    let interval = null;
    let endTime = null;

    function formatTime(totalSeconds) {
      const mins = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;
      return `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
    }

    function updateDisplay() {
      display.textContent = formatTime(remaining);
      document.title = `${formatTime(remaining)} – Timer`;
    }

    function getInputTime() {
      const mins = Math.max(0, Number(minutesInput.value) || 0);
      const secs = Math.min(59, Math.max(0, Number(secondsInput.value) || 0));
      return Math.floor(mins * 60 + secs);
    }

    function stopTimer() {
      clearInterval(interval);
      interval = null;
      endTime = null;
      startButton.disabled = false;
      pauseButton.disabled = true;
    }

    function tick() {
      remaining = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
      updateDisplay();

      if (remaining <= 0) {
        stopTimer();
        message.textContent = "Zeit abgelaufen!";
        document.title = "Zeit abgelaufen – Timer";
        alert("Zeit abgelaufen!");
      }
    }

    startButton.addEventListener("click", () => {
      if (interval) return;

      if (remaining <= 0) remaining = getInputTime();
      if (remaining <= 0) {
        message.textContent = "Bitte eine Zeit größer als 0 eingeben.";
        return;
      }

      message.textContent = "";
      endTime = Date.now() + remaining * 1000;
      startButton.disabled = true;
      pauseButton.disabled = false;
      tick();
      interval = setInterval(tick, 200);
    });

    pauseButton.addEventListener("click", () => {
      if (!interval) return;
      remaining = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
      stopTimer();
      updateDisplay();
      message.textContent = "Pausiert";
    });

    document.getElementById("reset").addEventListener("click", () => {
      stopTimer();
      remaining = getInputTime();
      updateDisplay();
      message.textContent = "";
    });

    [minutesInput, secondsInput].forEach(input => {
      input.addEventListener("input", () => {
        if (!interval) {
          remaining = getInputTime();
          updateDisplay();
          message.textContent = "";
        }
      });
    });

    updateDisplay();
  </script>
</body>
</html>
